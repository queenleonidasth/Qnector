<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Qnector Dark Royal — All Menus Review</title>
    <style>
      :root {
        --bg: #0f1013;
        --bg2: #17140f;
        --card: rgba(26, 27, 33, 0.78);
        --card2: rgba(15, 16, 20, 0.72);
        --line: rgba(224, 182, 82, 0.28);
        --line2: rgba(240, 200, 95, 0.52);
        --gold: #e6ba50;
        --gold2: #fbe6a2;
        --gold3: #a87e22;
        --text: #f5f4f0;
        --muted: #aaa69e;
        --sub: #817d75;
        --green: #31c46d;
        --red: #ef6666;
        --sans: "Segoe UI", Inter, system-ui, sans-serif;
        --royal: Georgia, "Times New Roman", serif;
        --mono: Consolas, "Cascadia Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: var(--sans);
        background: #08090b;
        color: var(--text);
        font-size: 12px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.2;
      }
      .stage {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0;
      }
      .app {
        position: relative;
        width: 451px;
        height: 978px;
        overflow: hidden;
        padding: 15px 16px 14px;
        background: radial-gradient(
          circle at 50% 16%,
          #211a10 0,
          #121316 46%,
          #0a0b0d 100%
        );
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 30px 80px #0008;
      }
      .app:before {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        top: 6px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          #a87e2244,
          #fbe6a2dd,
          #a87e2244,
          transparent
        );
        background-size: 180% 100%;
        animation: rail 5.2s ease-in-out infinite;
      }
      .app:after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          radial-gradient(circle at 15% 23%, #e6ba50 0 1px, transparent 1.5px),
          radial-gradient(circle at 82% 31%, #fbe6a2 0 1px, transparent 1.5px),
          radial-gradient(circle at 31% 74%, #e6ba50 0 1px, transparent 1.5px),
          radial-gradient(circle at 78% 84%, #e6ba50 0 1px, transparent 1.5px);
        animation: dust 10s ease-in-out infinite alternate;
      }
      .header,
      .main,
      .dock {
        position: relative;
        z-index: 2;
      }
      .header {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        animation: down 0.42s ease both;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .crest {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, #e6ba5018, #e6ba5005);
        box-shadow: 0 4px 14px #e6ba5030;
        animation: crest 4.8s ease-in-out infinite;
      }
      .crest span {
        font-size: 18px;
        color: var(--gold2);
      }
      .brand h1 {
        margin: 0;
        font: 700 17px/1 var(--royal);
        letter-spacing: 0.12em;
      }
      .brand small {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #edd898;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid #22c55e44;
        background: #22c55e12;
        color: #8df0ad;
        font-size: 10.5px;
        font-weight: 700;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 8px #31c46d99;
        animation: pulse 1.9s ease-in-out infinite;
      }
      .main {
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .glass {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(
          145deg,
          rgba(29, 30, 36, 0.84),
          rgba(17, 18, 22, 0.75)
        );
        box-shadow:
          0 16px 36px #0006,
          inset 0 1px #ffffff12;
        backdrop-filter: blur(18px);
      }
      .hero {
        height: 342px;
        padding: 18px 14px 14px;
        text-align: center;
        animation: rise 0.5s 0.05s both;
      }
      .orb-stage {
        height: 142px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .aura {
        position: absolute;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #e6ba5040 0,
          #e6ba5011 52%,
          transparent 71%
        );
        animation: aura 3.6s ease-in-out infinite;
      }
      .sphere {
        width: 108px;
        height: 108px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid #f0c85f70;
        background: radial-gradient(
          circle at 35% 30%,
          #ffffff2b,
          #1e202866 58%,
          #0a0c10dd 100%
        );
        box-shadow:
          0 10px 30px #000a,
          inset 0 2px 7px #ffffff3b;
        animation: float 4.4s ease-in-out infinite;
      }
      .core {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 38% 30%,
          #fff4cf,
          #f3ca52 24%,
          #d99822 55%,
          #86590d 86%
        );
        box-shadow:
          0 0 26px #e6ba5075,
          inset 0 3px 8px #ffffffb0;
        animation: core 3.2s ease-in-out infinite;
      }
      .hero h2 {
        margin: 3px 0 5px;
        font: 700 18px var(--royal);
        letter-spacing: 0.08em;
        color: var(--gold2);
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .endpoint {
        margin: 13px 0 10px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #0d0e12aa;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 10px;
      }
      .endpoint code {
        font: 600 10.5px var(--mono);
        color: #e4d099;
        flex: 1;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .copy {
        height: 28px;
        padding: 0 10px;
        border-radius: 7px;
        border: 1px solid #d4a337;
        background: linear-gradient(#f2d98a, #cb982b);
        color: #281d08;
        font-weight: 800;
        font-size: 10.5px;
      }
      .primary {
        width: 100%;
        height: 42px;
        border-radius: 11px;
        border: 1px solid #d2a13a;
        background: linear-gradient(120deg, #f7df96, #e6ba50 48%, #b8861e);
        background-size: 170% 100%;
        color: #1c1507;
        font-weight: 800;
        font-size: 12.5px;
        animation: goldflow 5.6s ease-in-out infinite;
      }
      .activity {
        min-height: 0;
        flex: 1;
        padding: 12px 13px 10px;
        display: flex;
        flex-direction: column;
        animation: rise 0.5s 0.12s both;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .section-head strong {
        font: 700 12.5px var(--royal);
        letter-spacing: 0.07em;
        color: var(--gold2);
      }
      .live {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #e6ba50;
        font-size: 10.5px;
        font-weight: 800;
      }
      .feed {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: hidden;
      }
      .feed-row {
        position: relative;
        height: 47px;
        border: 1px solid #ffffff0d;
        border-radius: 10px;
        background: #0f1014a8;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 9px;
        transition: 0.2s;
        overflow: hidden;
      }
      .feed-row.processing {
        border-color: #e6ba5066;
        box-shadow:
          inset 0 0 0 1px #e6ba501c,
          0 0 16px #e6ba5016;
        animation: processingBorder 2.2s ease-in-out infinite;
      }
      .feed-row.processing:before,
      .feed-row.processing:after {
        content: "";
        position: absolute;
        pointer-events: none;
        border-radius: 50%;
        left: 42%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.18);
        opacity: 0;
        background: radial-gradient(
          circle,
          #fbe6a238 0,
          #e6ba5020 38%,
          transparent 70%
        );
        animation: goldRipple 2.4s ease-out infinite;
      }
      .feed-row.processing:after {
        animation-delay: 1.2s;
      }
      .feed-row.processing .feed-title {
        color: var(--gold2);
      }
      .feed-row.processing .feed-meta {
        color: var(--gold);
      }
      .feed-row:hover {
        border-color: var(--line);
        box-shadow: inset 2px 0 #e6ba5073;
      }
      .feed-main {
        min-width: 0;
        flex: 1;
      }
      .feed-title {
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .feed-args {
        font: 500 10px var(--mono);
        color: var(--sub);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .feed-meta {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .dock {
        height: 57px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 5px 6px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #121318dc;
        box-shadow: 0 10px 24px #0009;
        animation: up 0.5s 0.18s both;
      }
      .dock button {
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        line-height: 1;
      }
      .dashboard-dock button {
        color: var(--gold);
      }
      .dashboard-dock button span {
        color: var(--gold2);
      }
      .dock button.active {
        border-color: var(--line2);
        background: linear-gradient(135deg, #e6ba5022, #e6ba5009);
        color: var(--gold2);
        box-shadow: 0 2px 10px #e6ba5024;
      }
      .drawer-shade {
        position: absolute;
        z-index: 20;
        inset: 0;
        background: #07080bb5;
        backdrop-filter: blur(8px);
        display: flex;
        align-items: flex-end;
      }
      .drawer {
        width: 100%;
        max-height: 84%;
        min-height: 54%;
        padding: 15px 17px 13px;
        border: 1px solid var(--line2);
        border-bottom: 0;
        border-radius: 22px 22px 0 0;
        background: linear-gradient(170deg, #1d1d23fa, #0e0f13fd);
        box-shadow: 0 -16px 50px #000d;
        display: flex;
        flex-direction: column;
        gap: 10px;
        animation: drawer 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .drawer.tall {
        height: 86%;
      }
      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer-head h2 {
        margin: 0;
        font: 700 16px var(--royal);
        letter-spacing: 0.06em;
        color: var(--gold2);
      }
      .close {
        width: 30px;
        height: 30px;
        border: 1px solid #ffffff12;
        border-radius: 8px;
        background: #ffffff06;
        color: var(--muted);
      }
      .tabs {
        height: 40px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        padding: 4px;
        border: 1px solid #e6ba502c;
        border-radius: 11px;
        background: #08090ca8;
      }
      .tabs span {
        display: grid;
        place-items: center;
        border-radius: 7px;
        color: var(--muted);
        font-size: 10.5px;
      }
      .tabs span.active {
        background: #e6ba5018;
        color: var(--gold2);
      }
      .scroll {
        min-height: 0;
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
      }
      .micro {
        font-size: 10px;
        color: var(--muted);
      }
      .path,
      .box,
      .card {
        border: 1px solid #ffffff10;
        border-radius: 10px;
        background: #0d0e12a8;
      }
      .path {
        padding: 10px;
        font: 600 10.5px var(--mono);
        color: #edd898;
        word-break: break-all;
      }
      .actions {
        display: flex;
        gap: 7px;
      }
      .secondary {
        flex: 1;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #e6ba500a;
        color: #e8dba9;
        font-size: 10.5px;
        font-weight: 700;
      }
      .secondary.danger {
        border-color: #ef666644;
        color: #f58d8d;
      }
      .card {
        padding: 10px 11px;
      }
      .card-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 800;
        color: #e4d39c;
      }
      .task {
        border: 1px solid #ffffff0c;
        border-radius: 8px;
        padding: 8px;
        margin-top: 6px;
        background: #ffffff04;
      }
      .task strong {
        font-size: 11px;
      }
      .pill {
        display: inline-flex;
        padding: 3px 6px;
        border-radius: 999px;
        border: 1px solid #e6ba5030;
        background: #e6ba5010;
        color: #e7cc79;
        font-size: 10px;
        font-weight: 750;
      }
      .pill.green {
        border-color: #31c46d44;
        background: #31c46d12;
        color: #83e8a7;
      }
      .pill.red {
        border-color: #ef666644;
        background: #ef666611;
        color: #f58d8d;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .skill {
        min-height: 67px;
        padding: 9px;
        border: 1px solid #ffffff10;
        border-radius: 11px;
        background: #0d0e12a8;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .skicon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #e6ba500d;
        color: var(--gold2);
        font-weight: 800;
      }
      .skill-main {
        min-width: 0;
        flex: 1;
      }
      .skill-name {
        font-size: 12px;
        font-weight: 800;
      }
      .skill-desc {
        font-size: 10.5px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .skill-meta {
        font-size: 10px;
        color: var(--sub);
        margin-top: 4px;
      }
      .search {
        height: 38px;
        border: 1px solid #ffffff12;
        border-radius: 9px;
        background: #0d0e12;
        padding: 0 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
      }
      .chips {
        display: flex;
        gap: 5px;
      }
      .chips span {
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid #ffffff10;
        background: #ffffff04;
        color: var(--muted);
        font-size: 10px;
      }
      .chips span.active {
        border-color: var(--line);
        background: #e6ba5013;
        color: var(--gold2);
      }
      .top-actions {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .add {
        height: 33px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--line2);
        background: #e6ba5011;
        color: var(--gold2);
        font-weight: 800;
        font-size: 10.5px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-size: 10.5px;
        font-weight: 700;
        color: #d9cfb7;
      }
      .field input,
      .field textarea,
      .field select {
        border: 1px solid #ffffff12;
        border-radius: 8px;
        background: #090a0d;
        color: var(--text);
        padding: 9px 10px;
        font-size: 11px;
        outline: none;
      }
      .field textarea {
        min-height: 112px;
        resize: none;
        font-family: var(--mono);
        font-size: 10.5px;
      }
      .detail-hero {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(135deg, #e6ba5011, #ffffff03);
      }
      .detail-hero h3 {
        margin: 0;
        color: var(--gold2);
        font-size: 15px;
      }
      .detail-hero p {
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1.45;
      }
      .settings-card {
        padding: 11px;
        border: 1px solid #ffffff0f;
        border-radius: 11px;
        background: #0d0e12a8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .settings-copy strong {
        display: block;
        font-size: 11px;
      }
      .settings-copy small {
        font-size: 10px;
        color: var(--muted);
      }
      .toggle {
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: #e6ba5038;
        border: 1px solid #e6ba5055;
        position: relative;
      }
      .toggle:after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        top: 2px;
        right: 2px;
        border-radius: 50%;
        background: var(--gold2);
      }
      .update {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: linear-gradient(145deg, #e6ba500d, #0d0e12cc);
      }
      .update-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .update-head strong {
        font-size: 12px;
      }
      .versions {
        display: grid;
        grid-template-columns: 1fr 26px 1fr;
        align-items: center;
        margin: 10px 0;
        gap: 5px;
      }
      .ver {
        border: 1px solid #ffffff0e;
        border-radius: 9px;
        background: #08090c88;
        padding: 8px;
      }
      .ver small {
        font-size: 10px;
        color: var(--muted);
      }
      .ver strong {
        display: block;
        font-size: 15px;
        color: var(--gold2);
        margin-top: 2px;
      }
      .runtime-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .runtime-card {
        padding: 9px;
        border: 1px solid #ffffff0e;
        border-radius: 9px;
        background: #0c0d10;
      }
      .runtime-card small {
        font-size: 10px;
        color: var(--muted);
      }
      .runtime-card strong {
        display: block;
        font-size: 12px;
        margin-top: 2px;
      }
      .runtime-sec {
        border: 1px solid #ffffff0e;
        border-radius: 9px;
        background: #ffffff03;
        padding: 9px;
      }
      .runtime-sec .head {
        display: flex;
        justify-content: space-between;
        font-size: 10.5px;
        font-weight: 750;
      }
      .runtime-row {
        display: flex;
        gap: 7px;
        padding-top: 7px;
        margin-top: 7px;
        border-top: 1px solid #ffffff09;
      }
      .runtime-row strong {
        font-size: 10.5px;
      }
      .runtime-row small {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .modal-shade {
        position: absolute;
        z-index: 40;
        inset: 0;
        background: #050609c7;
        backdrop-filter: blur(9px);
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .modal {
        width: 100%;
        max-height: 86%;
        overflow: hidden;
        border: 1px solid var(--line2);
        border-radius: 17px;
        background: linear-gradient(160deg, #202027, #0c0d10);
        box-shadow: 0 25px 70px #000e;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal h2 {
        margin: 0;
        font: 700 16px var(--royal);
        color: var(--gold2);
      }
      .result {
        border: 1px solid #31c46d35;
        border-radius: 10px;
        background: #31c46d0b;
        padding: 10px;
      }
      .rank {
        display: flex;
        justify-content: space-between;

      }
      const restart = () =>
        `${header()}<main class="main"><section class="glass hero" style="opacity:.18"></section>${feed()}</main>${nav("settings")}<div class="modal-shade"><div class="modal" style="text-align:center;max-width:370px"><div class="restart-core">Q</div><h2>RESTARTING QNECTOR</h2><div class="muted" style="font-size:11px;line-height:1.5">Update verified successfully. Closing the current window and relaunching the new version…</div><div class="progress"><span></span></div><div class="micro">Please keep Qnector open while restart completes.</div></div></div>`;
      const activityDetail = () =>
        `${dashboard()}<div class="modal-shade" style="align-items:end;place-items:end center"><div class="modal" style="margin-bottom:8px"><div class="drawer-head"><div><span class="pill green">SUCCESS</span><h2 style="margin-top:6px">files.read</h2></div><button class="close">✕</button></div><div class="runtime-grid"><div class="runtime-card"><small>Duration</small><strong>2 ms</strong></div><div class="runtime-card"><small>Time</small><strong>15:50:54</strong></div></div><div class="card"><div class="card-title">REQUEST / ARGUMENTS</div><pre style="font:10.5px var(--mono);white-space:pre-wrap;color:#d8cca5">{ "path": "renderer.tsx", "offsetLine": 1740 }</pre></div><div class="card"><div class="card-title">WHAT IT DID</div><div class="micro">Read 1038 lines from renderer.tsx and returned the current drawer and settings implementation.</div></div></div></div>`;
      function setup(step) {
        const bodies = [
          `<div class="detail-hero"><h3>First, check this PC</h3><p>Qnector includes the local MCP server and OpenAI tunnel client. Confirm both are ready before continuing.</p></div><div class="setup-list"><div class="setup-item"><span class="pill green">✓</span><div><strong>Bundled tunnel-client</strong><div class="micro">Client found and ready</div></div></div><div class="setup-item"><span class="pill green">✓</span><div><strong>Local MCP server</strong><div class="micro">http://127.0.0.1:8787/mcp</div></div></div></div>`,
          `<div class="detail-hero"><h3>Create tunnel credentials</h3><p>Create or copy a Tunnel ID, then create a Runtime API key with Tunnels Read + Use.</p></div><div class="actions"><button class="secondary">① Open Tunnels ↗</button><button class="secondary">② Runtime Keys ↗</button></div><div class="field"><label>Tunnel ID</label><input value="tunnel_qnector_queen" /></div><div class="field"><label>Runtime API Key</label><input value="••••••••••••••••" /></div><div class="field"><label>Profile name · optional</label><input value="qnector" /></div>`,
          `<div class="detail-hero"><h3>Finish setup in ChatGPT Web</h3><p>The tunnel is connected. Complete these steps so ChatGPT can discover Qnector tools.</p></div><div class="setup-list"><div class="setup-item"><span class="num">1</span><div><strong>Open Connector Settings</strong><div class="micro">Settings → Apps → Create</div></div></div><div class="setup-item"><span class="num">2</span><div><strong>Create a Qnector connector</strong><div class="micro">Connection: Tunnel</div></div></div><div class="setup-item"><span class="num">3</span><div><strong>Scan / refresh tools</strong><div class="micro">Confirm 8 grouped Qnector tools</div></div></div><div class="setup-item"><span class="num">4</span><div><strong>Enable Qnector in chat</strong><div class="micro">Select or @mention Qnector</div></div></div></div>`,
          `<div style="text-align:center;padding-top:10px"><div class="restart-core" style="animation:none">✓</div><h3 style="color:var(--gold2);font:700 17px var(--royal)">QNECTOR IS READY</h3><p class="muted" style="font-size:11px;line-height:1.5">First-run setup is complete. Keep Qnector connected and select it whenever ChatGPT needs local tools.</p></div><div class="card"><div class="card-title">Quick test</div><div class="micro">Ask ChatGPT to use Qnector, call system info and inspect the active workspace without making changes.</div></div><button class="primary" style="height:38px">Open ChatGPT ↗</button>`,
        ];
        return `${header()}<main class="main"><section class="glass hero" style="opacity:.16"></section>${feed()}</main>${nav("settings")}<div class="modal-shade"><div class="modal" style="max-height:92%"><div class="drawer-head"><div><span class="micro" style="color:var(--gold2)">QNECTOR SETUP ASSISTANT</span><h2>Connect Qnector to ChatGPT</h2></div><button class="close">✕</button></div><div class="setup-progress">${[1, 2, 3, 4].map((n) => `<i class="setup-step ${n <= step ? "on" : ""}"></i>`).join("")}</div><div class="micro">Step ${step} of 4</div>${bodies[step - 1]}<div class="actions"><button class="secondary">${step === 1 ? "Not now" : "Back"}</button><button class="primary" style="height:36px">${step === 1 ? "Continue" : step === 2 ? "Save & Connect" : step === 3 ? "I've added Qnector" : "Finish"}</button></div></div></div>`;
      }
      function render() {
        const f = {
          dashboard,
          workspace,
          memory,
          skills: skillsList,
          "skill-detail": skillDetail,
          "skill-edit": skillEdit,
          "skill-trigger": skillTrigger,
          settings,
          runtime,
          "update-checking": () => updateView("update-checking"),
          "update-available": () => updateView("update-available"),
          restart,
          "activity-detail": activityDetail,
          "setup-1": () => setup(1),
          "setup-2": () => setup(2),
          "setup-3": () => setup(3),
          "setup-4": () => setup(4),
        };
        document.getElementById("app").innerHTML = (f[active] || dashboard)();
        document
          .querySelectorAll("#reviewButtons button")
          .forEach((b) => b.classList.toggle("on", b.dataset.v === active));
      }
      function go(v) {
        active = v;
        history.replaceState(null, "", `?view=${v}`);
        render();
      }
      document.getElementById("reviewButtons").innerHTML = views
        .map(
          ([k, l]) =>
            `<button data-v="${k}" onclick="go('${k}')">${l}</button>`,
        )
        .join("");
      render();
    </script>
  </body>
</html>
